<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FırsatPulsu">
  <defs>
    <linearGradient id="fpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="fpPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <filter id="fpGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#fpBg)"/>

  <!-- Nabız (pulse) çizgisi -->
  <polyline points="92,268 176,268 212,176 256,344 300,196 336,268 420,268"
            fill="none" stroke="url(#fpPulse)" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#fpGlow)"/>

  <!-- Tepe vurgu noktası -->
  <circle cx="300" cy="196" r="15" fill="#FBBF24"/>

  <!-- Fiyat-düşüş oku (sağ alt rozet) -->
  <g transform="translate(360,360)">
    <circle cx="0" cy="0" r="56" fill="#10B981"/>
    <path d="M 0 -26 L 0 22 M -18 4 L 0 24 L 18 4"
          fill="none" stroke="#FFFFFF" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
